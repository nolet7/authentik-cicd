name: CI/CD: Authentik Deployment via Argo CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: noletengine/authentik-cicd
  ARGOCD_APP_NAME: authentik
  K8S_NAMESPACE: authentik

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: DockerHub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Image
        run: |
          IMAGE_TAG=${GITHUB_SHA::8}
          docker build -t $REGISTRY/$IMAGE_NAME:$IMAGE_TAG -f docker/Dockerfile .
          docker push $REGISTRY/$IMAGE_NAME:$IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Update Helm values file with image tag
        run: |
          sed -i "s|tag:.*|tag: $IMAGE_TAG|" helm/authentik/dev-values.yaml

      - name: Commit updated tag
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git commit -am "ci: update image tag to $IMAGE_TAG"
          git push

  vault-setup:
    name: Vault Integration
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Enable Kubernetes Auth in Vault
        run: bash scripts/enable-k8s-auth.sh
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          K8S_HOST: ${{ secrets.K8S_HOST }}
          K8S_CA_CRT: ${{ secrets.K8S_CA_CRT }}
          SA_JWT_TOKEN: ${{ secrets.SA_JWT_TOKEN }}

      - name: Push Vault Secrets
        run: bash scripts/push-vault-secrets.sh
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          AUTHENTIK_SECRET_KEY: ${{ secrets.AUTHENTIK_SECRET_KEY }}
          PG_PASS: ${{ secrets.PG_PASS }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}

  deploy:
    name: Deploy via Argo CD
    runs-on: ubuntu-latest
    needs: vault-setup

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Argo CD CLI
        run: |
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv argocd /usr/local/bin/argocd

      - name: Authenticate with Argo CD
        run: |
          argocd login ${{ secrets.ARGOCD_SERVER }} \
            --username "${{ secrets.ARGOCD_USERNAME }}" \
            --password "${{ secrets.ARGOCD_PASSWORD }}" \
            --insecure

      - name: Sync Argo CD Application
        run: |
          argocd app sync $ARGOCD_APP_NAME
          argocd app wait $ARGOCD_APP_NAME --health --timeout 300

