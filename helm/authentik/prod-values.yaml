image:
  repository: noletengine/authentik-cicd
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 3

service:
  type: ClusterIP
  port: 9000

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: authentik.srespace.tech
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - authentik.srespace.tech
      secretName: authentik-tls
